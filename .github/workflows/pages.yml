name: Publish Neyer review site

on:
  push:
    branches: [codex/neyer-v110, main]
    paths: ["site/**", "tools/validate_public_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate public site
        run: python3 tools/validate_public_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
